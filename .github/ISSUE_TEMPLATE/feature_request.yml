name: Feature request
description: Suggest an improvement to the skills, validators, or documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the scientific or maintenance problem the change would solve. Do not include patient data or copyrighted full texts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or unsafe about the current behaviour?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and which skill or file would own it?
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This proposal does not choose eligibility or a synthesis method because of an observed result.
          required: true
